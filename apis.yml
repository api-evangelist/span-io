apis:
  - aid: span-io:span-rest-api
    name: SPAN REST API
    description: >-
      Local on-premise HTTP/JSON REST API hosted directly on SPAN Panel. The API exposes authentication (registering API
      clients and obtaining JWT access tokens), system status, Wi-Fi scan and connect, panel state, main meter, panel
      power, islanding state, per-circuit control, panel grid relay control, emergency reconnect, and energy storage
      state-of-energy and nice-to-have thresholds. All access is local-only on the home LAN; authentication uses HTTP
      Bearer JWT credentials minted by the panel itself. Available initially on SPAN Panel MAIN 32 with firmware r202603
      and later, with rollout to MAIN 16 / MLO 24 / MAIN 40 / MLO 48 planned for the second half of 2026.
    humanURL: https://github.com/spanio/SPAN-API-Client-Docs
    baseURL: http://span-{serial-number}.local/api/v1
    tags:
      - Energy
      - Home Energy
      - Smart Panel
      - REST
      - On-Premise
      - Circuits
      - Energy Storage
      - Grid
      - Islanding
