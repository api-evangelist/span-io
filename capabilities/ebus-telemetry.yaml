apiVersion: capabilities.naftiko.dev/v1
kind: Capability
metadata:
  name: span-ebus-telemetry
  title: SPAN eBus Telemetry
  provider: span-io
  api: span-ebus-mqtt-api
  tags:
    - MQTT
    - Pub/Sub
    - Streaming
    - Homie
    - eBus
spec:
  description: >-
    Subscribe to real-time SPAN Panel telemetry over MQTT/Homie/eBus and
    issue control by publishing to Homie `/set` topics. Covers panel state,
    grid relay, islanding state, per-circuit power and relay state, energy
    storage SoE, and SPAN Drive integrations.
  operations:
    - id: subscribe-panel-state
      summary: Subscribe to panel Homie $state lifecycle.
      protocol: mqtt
      topic: ebus/5/{serial}/$state
    - id: subscribe-panel-description
      summary: Subscribe to the panel Homie $description schema.
      protocol: mqtt
      topic: ebus/5/{serial}/$description
    - id: subscribe-panel-power
      summary: Subscribe to whole-home power telemetry.
      protocol: mqtt
      topic: ebus/5/{serial}/panel/power
    - id: subscribe-panel-meter
      summary: Subscribe to main meter energy registers.
      protocol: mqtt
      topic: ebus/5/{serial}/panel/meter
    - id: subscribe-grid
      summary: Subscribe to main grid relay state.
      protocol: mqtt
      topic: ebus/5/{serial}/panel/grid
    - id: publish-grid-set
      summary: Publish desired grid relay state.
      protocol: mqtt
      topic: ebus/5/{serial}/panel/grid/set
    - id: subscribe-circuit
      summary: Subscribe to per-circuit relay state.
      protocol: mqtt
      topic: ebus/5/{serial}/circuits/{circuitId}/relay-state
    - id: publish-circuit-set
      summary: Publish desired per-circuit relay state.
      protocol: mqtt
      topic: ebus/5/{serial}/circuits/{circuitId}/relay-state/set
    - id: subscribe-storage-soe
      summary: Subscribe to energy storage state-of-energy.
      protocol: mqtt
      topic: ebus/5/{serial}/storage/soe
