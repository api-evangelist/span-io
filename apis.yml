  - aid: span-io:span-ebus-mqtt-api
    name: SPAN eBus MQTT API
    description: >-
      Publish/subscribe streaming API hosted on SPAN Panel using the Electrification Bus (eBus) integration framework
      and the Homie Convention. SPAN Panel hosts an MQTT broker accessible over MQTTS (8883), WS, and WSS. Clients
      subscribe to `ebus/5/<serial>/...` topics to receive real-time panel state, per-circuit telemetry, energy storage
      state, and SPAN Drive integration data, and publish to `/set` topics to operate relays and control panel state.
      The broker enforces topic-level ACLs — full read access on `ebus/#`, write access limited to Homie `/set` control
      topics and to non-panel device subtrees under `ebus/5/`. Credentials are obtained via the REST authentication
      endpoint.
    humanURL: https://github.com/spanio/SPAN-API-Client-Docs#span-api-interaction-models
    tags:
