aid: span-io
name: SPAN
description: >-
  SPAN is a San Francisco-based home energy technology company building smart electrical panels that replace traditional
  residential breaker boxes with a software-defined, controllable, and metered panel. SPAN Panel provides whole-home
  real-time power and energy metering, per-circuit monitoring and remote relay control, grid/islanding state management
  for whole-home backup with solar and energy storage, EV charging coordination via SPAN Drive, and a mobile app for
  energy management. As of the SPAN Panel firmware r202603 release (Q1 2026), SPAN exposes a public-beta on-premise SPAN
  API for software integrations between SPAN Panel and other devices on the home Local Area Network. The SPAN API is a
  real, documented HTTP + MQTT/Homie surface that runs directly on the panel — there is no cloud-hosted developer
  endpoint. The REST surface provides authentication, system status, Wi-Fi setup, panel state, per-circuit control,
  panel grid relay, energy storage state-of-energy, and emergency reconnect operations. The publish/subscribe surface
  uses the Electrification Bus (eBus) framework and Homie Convention over MQTT for streaming real-time panel state,
  per-circuit telemetry, and control of relays. SPAN API is licensed for personal, non-commercial use under MIT-0 for
  docs and example code; commercial / fleet use requires the separately licensed SPAN Fleet Manager.
